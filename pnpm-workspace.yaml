packages:
  - packages/*
  - services/*
  - providers

allowBuilds:
  cpu-features: false
  esbuild: true
  protobufjs: false
  ssh2: false

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - '@testcontainers/postgresql@12.0.4'
  - '@types/node@26.1.2'
  - '@types/pg@8.20.0'
  - '@vercel/ncc@0.44.1'
  - ajv@8.20.0
  - ajv-formats@3.0.1
  - fastify@5.10.0
  - pg@8.22.0
  - tsx@4.23.1
  - typescript@7.0.2
  - vitest@4.1.10
  - yaml@2.9.0
