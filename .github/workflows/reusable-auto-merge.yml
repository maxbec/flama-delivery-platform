name: Reusable Auto Merge

# Arms GitHub's auto-merge on a pull request that only needs its checks to
# finish, so a green change lands without anyone pressing the button.
#
# It arms; it never merges. Every required check, and the branch-up-to-date
# rule, is still enforced by GitHub at the moment of merge — this only removes
# the human from a decision that was already made by the gates.
#
# Release pull requests are excluded on purpose: cutting a version is the one
# call that stays a person's. So is anything targeting the release branch,
# which is how a promotion reaches production.
#
# The identity that arms is the identity that merges, and that identity decides
# whether the merge is seen. A merge performed by the default workflow token is
# recorded as github-actions[bot], and pushes by that actor never start push
# workflows — GitHub's recursion guard — so the release and deploy runs that
# should follow a self-merged pull request silently do not happen. Arming with
# a GitHub App installation token makes the App the merging actor, and its
# merge push starts them. The App credentials are optional: a caller without
# them keeps the default token together with its documented limitation.

on:
  workflow_call:
    inputs:
      profile:
        description: Flama branch profile
        required: true
        type: string
      release-branch:
        description: >-
          Branch that publishes releases. Pull requests targeting it are never
          armed, because that is the promotion a person decides.
        required: false
        default: main
        type: string
      runner-labels:
        description: >-
          JSON array of runs-on labels, e.g. '["self-hosted","mainz-homelab"]'.
          Defaults to the billed GitHub-hosted runner so public and foreign
          consumers keep running unchanged.
        required: false
        default: '["ubuntu-latest"]'
        type: string
    secrets:
      WORKFLOW_APP_ID:
        description: >-
          GitHub App id used to arm auto-merge, so the eventual merge is
          attributed to the App and its push to the base branch starts push
          workflows. Optional; the default workflow token is used when absent.
        required: false
      WORKFLOW_APP_PRIVATE_KEY:
        description: >-
          Private key of the same GitHub App. Optional, but must be provided
          together with WORKFLOW_APP_ID.
        required: false

permissions:
  contents: read

concurrency:
  group: auto-merge-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  arm:
    name: Flama Auto Merge
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Decide whether this pull request may arm
        id: decide
        env:
          FLAMA_APP_ID: ${{ secrets.WORKFLOW_APP_ID }}
          FLAMA_APP_PRIVATE_KEY: ${{ secrets.WORKFLOW_APP_PRIVATE_KEY }}
          FLAMA_BASE_REF: ${{ github.event.pull_request.base.ref }}
          FLAMA_DRAFT: ${{ github.event.pull_request.draft }}
          FLAMA_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          FLAMA_PROFILE: ${{ inputs.profile }}
          FLAMA_RELEASE_BRANCH: ${{ inputs.release-branch }}
        run: |
          # A half-configured credential would silently fall back to the
          # default token, reintroducing the invisible-merge problem while
          # looking configured. Refuse it instead.
          app=false
          if [[ -n "$FLAMA_APP_ID" && -n "$FLAMA_APP_PRIVATE_KEY" ]]; then
            app=true
          elif [[ -n "$FLAMA_APP_ID" || -n "$FLAMA_APP_PRIVATE_KEY" ]]; then
            echo '::error::WORKFLOW_APP_ID and WORKFLOW_APP_PRIVATE_KEY must be provided together'
            exit 1
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"

          arm=true
          reason=eligible

          # release-please owns this branch prefix. Its pull request is the
          # decision to cut a version, which is not a decision a gate makes.
          case "$FLAMA_HEAD_REF" in
            release-please--*) arm=false; reason=release_pull_request ;;
          esac

          # On the two-branch profile the release branch is reached only by a
          # promotion, and a promotion is deliberate. On a single-branch profile
          # that same branch is ordinary work, so the rule would stop everything.
          if [[ "$arm" == true && "$FLAMA_PROFILE" == major && "$FLAMA_BASE_REF" == "$FLAMA_RELEASE_BRANCH" ]]; then
            arm=false
            reason=promotion
          fi

          # A draft is unfinished by its author's own statement.
          if [[ "$arm" == true && "$FLAMA_DRAFT" == true ]]; then
            arm=false
            reason=draft
          fi

          echo "arm=$arm" >> "$GITHUB_OUTPUT"
          echo "$reason"

      # Merging a pull request that touches .github/workflows/** writes those
      # files, and GitHub refuses that to an App token without the `workflows`
      # permission:
      #
      #   refusing to allow a GitHub App to create or update workflow
      #   `.github/workflows/ci.yml` without `workflows` permission
      #
      # Dependabot bumps of action versions are exactly this shape, so they
      # could never self-merge. The permission is requested only for the heads
      # that need it rather than on every merge, so an ordinary code change
      # still gets a token that cannot rewrite CI.
      - name: Note whether the head touches workflow files
        id: workflows
        if: ${{ steps.decide.outputs.arm == 'true' && steps.decide.outputs.app == 'true' }}
        env:
          FLAMA_PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api --paginate \
            "repos/$GITHUB_REPOSITORY/pulls/$FLAMA_PR_NUMBER/files" \
            --jq '.[].filename' | grep -q '^\.github/workflows/'; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      # No step in this job checks out or executes pull-request code, so the
      # credential is never exposed to the change under review. The token is
      # narrowed to this repository and to the permissions arming needs.
      - name: Mint the App installation token that will own the merge
        id: app-token
        if: ${{ steps.decide.outputs.arm == 'true' && steps.decide.outputs.app == 'true' && steps.workflows.outputs.needed == 'false' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.WORKFLOW_APP_ID }}
          private-key: ${{ secrets.WORKFLOW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Mint the App installation token for a head that rewrites CI
        id: app-token-workflows
        if: ${{ steps.decide.outputs.arm == 'true' && steps.decide.outputs.app == 'true' && steps.workflows.outputs.needed == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.WORKFLOW_APP_ID }}
          private-key: ${{ secrets.WORKFLOW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Arm auto-merge
        if: ${{ steps.decide.outputs.arm == 'true' }}
        env:
          FLAMA_PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token || steps.app-token-workflows.outputs.token || github.token }}
        run: |
          # Already armed is the expected steady state, not a failure: this runs
          # again on every synchronize. Anything else is reported.
          if gh pr merge "$FLAMA_PR_URL" --squash --auto 2>"$RUNNER_TEMP/arm.err"; then
            exit 0
          fi
          if grep -qi 'already enabled\|auto merge is already' "$RUNNER_TEMP/arm.err"; then
            exit 0
          fi
          cat "$RUNNER_TEMP/arm.err" >&2
          exit 1
