name: Probe Infisical OIDC

# Throwaway diagnostic. It proves the release publisher's credential path end
# to end -- Cloudflare Access -> Infisical OIDC login -> secret read -- without
# building, tagging or publishing anything. Delete the branch when done.
on:
  push:
    branches: [chore/probe-infisical-oidc]

permissions:
  contents: read

jobs:
  probe:
    name: Probe Infisical OIDC
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The same environment as publish-release, so the identity's subject
    # binding (repo:...:environment:platform-release) is exercised for real.
    environment: platform-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Report the configuration under test
        env:
          FLAMA_INFISICAL_DOMAIN: ${{ vars.INFISICAL_DOMAIN }}
          FLAMA_INFISICAL_ENV_SLUG: ${{ vars.INFISICAL_ENV_SLUG }}
          FLAMA_INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID }}
          FLAMA_INFISICAL_PROJECT_SLUG: ${{ vars.INFISICAL_PROJECT_SLUG }}
          FLAMA_INFISICAL_SECRET_PATH: ${{ vars.INFISICAL_SECRET_PATH }}
          FLAMA_CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          FLAMA_CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          echo "domain=$FLAMA_INFISICAL_DOMAIN"
          echo "env-slug=$FLAMA_INFISICAL_ENV_SLUG"
          echo "project-slug=$FLAMA_INFISICAL_PROJECT_SLUG"
          echo "secret-path=$FLAMA_INFISICAL_SECRET_PATH"
          echo "identity-id set: ${#FLAMA_INFISICAL_IDENTITY_ID} chars"
          echo "cf client-id set: ${#FLAMA_CF_ACCESS_CLIENT_ID} chars"
          echo "cf client-secret set: ${#FLAMA_CF_ACCESS_CLIENT_SECRET} chars"
          echo "expected oidc subject: repo:${GITHUB_REPOSITORY}:environment:platform-release"

      - name: Confirm Cloudflare Access admits the service token
        env:
          FLAMA_INFISICAL_DOMAIN: ${{ vars.INFISICAL_DOMAIN }}
          FLAMA_CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          FLAMA_CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          # An empty POST to the OIDC login endpoint. Access decides first: a
          # 403 with a cf-access-* header means the service token was refused,
          # anything from Infisical itself (400/401) means Access let us in.
          status=$(curl -sS -o response.txt -w '%{http_code}' \
            -X POST "${FLAMA_INFISICAL_DOMAIN}/api/v1/auth/oidc-auth/login" \
            -H "CF-Access-Client-Id: ${FLAMA_CF_ACCESS_CLIENT_ID}" \
            -H "CF-Access-Client-Secret: ${FLAMA_CF_ACCESS_CLIENT_SECRET}" \
            -H 'Content-Type: application/json' \
            -d '{}' || true)
          echo "status=$status"
          if grep -qi 'cloudflare access' response.txt; then
            echo "::error::Cloudflare Access refused the service token"
            exit 1
          fi
          echo "Access passed the request through to Infisical"

      - name: Load the Maxbec delivery App credentials from Infisical
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          domain: ${{ vars.INFISICAL_DOMAIN }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ vars.INFISICAL_ENV_SLUG }}
          secret-path: ${{ vars.INFISICAL_SECRET_PATH }}
          include-imports: false
          recursive: false
          extra-headers: |
            CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
            CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Confirm the App credentials arrived
        run: |
          # Lengths only. Never echo the values.
          [[ -n "$FLAMA_GITHUB_APP_ID_MAXBEC" ]] || { echo "::error::FLAMA_GITHUB_APP_ID_MAXBEC missing"; exit 1; }
          [[ -n "$FLAMA_GITHUB_APP_PRIVATE_KEY_MAXBEC" ]] || { echo "::error::FLAMA_GITHUB_APP_PRIVATE_KEY_MAXBEC missing"; exit 1; }
          echo "app id: ${#FLAMA_GITHUB_APP_ID_MAXBEC} chars"
          echo "private key: ${#FLAMA_GITHUB_APP_PRIVATE_KEY_MAXBEC} chars"

      - name: Mint a repository-scoped Maxbec App token
        id: release-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ env.FLAMA_GITHUB_APP_ID_MAXBEC }}
          private-key: ${{ env.FLAMA_GITHUB_APP_PRIVATE_KEY_MAXBEC }}
          owner: ${{ github.repository_owner }}
          repositories: flama-delivery-platform
          permission-administration: read
          permission-contents: write

      - name: Check the immutable-releases permission the publisher needs
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
        run: |
          # This is the call that returned 403 without Administration: read.
          if enabled=$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/immutable-releases" --jq '.enabled' 2>error.txt); then
            echo "immutable-releases enabled=$enabled"
            [[ "$enabled" == "true" ]] || { echo "::error::Immutable releases are not enabled"; exit 1; }
          else
            echo "::error::immutable-releases read failed - the App still lacks Administration: read"
            sed -n '1,5p' error.txt
            exit 1
          fi
