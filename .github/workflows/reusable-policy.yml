name: Reusable Policy Gate

on:
  workflow_call:
    inputs:
      base-sha:
        description: Exact pull-request base SHA
        required: true
        type: string
      head-sha:
        description: Exact untrusted pull-request head SHA to verify
        required: true
        type: string
      paperclip-app-slug:
        description: Owner-scoped Delivery Controller GitHub App slug
        required: true
        type: string
      platform-sha:
        description: Exact platform commit used by generated callers
        required: true
        type: string
      profile:
        description: Flama branch profile
        required: true
        type: string
      runner-labels:
        description: >-
          JSON array of runs-on labels, e.g. '["self-hosted","mainz-homelab"]'.
          Defaults to the billed GitHub-hosted runner so public and foreign
          consumers keep running unchanged.
        required: false
        default: '["ubuntu-latest"]'
        type: string

permissions:
  checks: read
  contents: read

concurrency:
  group: policy-${{ github.repository }}-${{ inputs.head-sha }}
  cancel-in-progress: true

jobs:
  policy:
    name: Flama Policy Gate
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    timeout-minutes: 10
    steps:
      - name: Validate exact SHA input
        env:
          FLAMA_BASE_SHA: ${{ inputs.base-sha }}
          FLAMA_EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FLAMA_EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FLAMA_HEAD_SHA: ${{ inputs.head-sha }}
          FLAMA_PLATFORM_SHA: ${{ inputs.platform-sha }}
        run: |
          [[ "$FLAMA_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$FLAMA_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$FLAMA_PLATFORM_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$FLAMA_BASE_SHA" == "$FLAMA_EVENT_BASE_SHA" ]]
          [[ "$FLAMA_HEAD_SHA" == "$FLAMA_EVENT_HEAD_SHA" ]]

      - name: Check out exact platform policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: maxbec/flama-delivery-platform
          ref: ${{ inputs.platform-sha }}
          path: platform
          persist-credentials: false

      - name: Check out exact consumer source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head-sha }}
          fetch-depth: 0
          path: consumer
          persist-credentials: false

      # A consumer's platform lock carries a semver label and a commit, and until
      # now nothing tied the two together — the gate only checked that the label
      # matched the contract and the commit matched the workflow input, so the
      # label was unverified free text and a pin to an untagged commit passed
      # under the name of a release. The one fact that binds them is which
      # release tag actually points at the pinned commit, and it is read here
      # from the platform repository rather than from the consumer, so an
      # untrusted head cannot forge it. Empty output means no release tag points
      # at that commit; the gate rejects, because no version can equal it.
      - name: Resolve the release tag at the pinned platform commit
        id: platform-tag
        env:
          FLAMA_PLATFORM_SHA: ${{ inputs.platform-sha }}
        run: |
          refs=$(git ls-remote --tags https://github.com/maxbec/flama-delivery-platform.git)
          version=$(printf '%s\n' "$refs" | awk -v sha="$FLAMA_PLATFORM_SHA" '
            {
              ref = $2
              if (ref ~ /\^\{\}$/) { sub(/\^\{\}$/, "", ref); peeled[ref] = $1 }
              else { plain[ref] = $1 }
            }
            END {
              for (ref in plain) {
                commit = (ref in peeled) ? peeled[ref] : plain[ref]
                if (commit == sha && ref ~ /^refs\/tags\/v[0-9]+\.[0-9]+\.[0-9]+$/) {
                  sub(/^refs\/tags\/v/, "", ref)
                  print ref
                }
              }
            }' | sort -u)
          # Two release tags on one commit leave no single answer, and handing
          # the gate a guess is worse than failing loudly here. It is also what
          # keeps the line below from writing a second key into the step output.
          [[ "$version" != *$'\n'* ]]
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Classify deployment-only changes
        id: change
        env:
          FLAMA_BASE_SHA: ${{ inputs.base-sha }}
          FLAMA_HEAD_SHA: ${{ inputs.head-sha }}
        run: |
          mapfile -d '' files < <(git -C consumer diff --name-only --no-renames -z "$FLAMA_BASE_SHA" "$FLAMA_HEAD_SHA")
          if [[ "${#files[@]}" -eq 1 && "${files[0]}" == ".deploy/production.yaml" ]]; then
            echo 'mode=deployment' >> "$GITHUB_OUTPUT"
          else
            echo 'mode=code' >> "$GITHUB_OUTPUT"
          fi

      - name: Validate delivery contract and generated trust boundary
        env:
          FLAMA_APP_SLUG: ${{ inputs.paperclip-app-slug }}
          FLAMA_BASE_REF: ${{ github.event.pull_request.base.ref }}
          FLAMA_PLATFORM_SHA: ${{ inputs.platform-sha }}
          FLAMA_PLATFORM_TAG_VERSION: ${{ steps.platform-tag.outputs.version }}
          FLAMA_PROFILE: ${{ inputs.profile }}
        run: |
          node platform/scripts/consumer-policy-gate.mjs \
            consumer \
            "$FLAMA_BASE_REF" \
            "$FLAMA_PROFILE" \
            "$FLAMA_PLATFORM_SHA" \
            "$FLAMA_APP_SLUG" \
            "$FLAMA_PLATFORM_TAG_VERSION" >/dev/null

      # The preflight is published by the repository's own Flama Preflight
      # workflow — and, where it runs, by the sweep on ai-vm — after this gate
      # has usually already started. This gate used to wait for it, sleeping
      # up to 35 minutes on a runner. With the publisher on the same runner
      # pool that is a deadlock on one runner and a queue on two: the gate
      # holds the slot the job it is waiting for needs. So it no longer waits.
      #
      # A completed preflight is judged now. A failure is a verdict, and no
      # amount of waiting turns it into a pass. One that is absent or still
      # running is left to the gates that decide the merge: the merge gate and
      # the required-check rule both refuse a head without a successful,
      # App-authored Flama Preflight, and both re-evaluate the moment it
      # lands. Nothing merges on this gate's word alone.
      - name: Judge the app-authored Flama Preflight where it has completed
        if: ${{ steps.change.outputs.mode == 'code' }}
        env:
          FLAMA_APP_SLUG: ${{ inputs.paperclip-app-slug }}
          FLAMA_HEAD_SHA: ${{ inputs.head-sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          response=$(mktemp "$RUNNER_TEMP/flama-checks-XXXXXX.json")
          trap 'rm -f "$response"' EXIT

          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/$GITHUB_REPOSITORY/commits/$FLAMA_HEAD_SHA/check-runs?check_name=Flama%20Preflight&filter=all&per_page=100" \
            >"$response" 2>/dev/null || printf '{"check_runs":[]}\n' >"$response"

          if jq -e \
            --arg app "$FLAMA_APP_SLUG" \
            --arg sha "$FLAMA_HEAD_SHA" \
            '[.check_runs[] | select(
              .name == "Flama Preflight" and
              .head_sha == $sha and
              .status == "completed" and
              .conclusion == "success" and
              .app.slug == $app and
              (.external_id | test("^flama-preflight:sha256:[0-9a-f]{64}$"))
            )] | length == 1' "$response" >/dev/null; then
            echo "App-authored Flama Preflight passed for $FLAMA_HEAD_SHA."
            exit 0
          fi

          # A completed check from the right app that did not succeed is a
          # verdict, not a gap. A check re-run after a fix arrives as a newer
          # check run of the same name, and the success test above sees it.
          if jq -e \
            --arg app "$FLAMA_APP_SLUG" \
            --arg sha "$FLAMA_HEAD_SHA" \
            '[.check_runs[] | select(
              .name == "Flama Preflight" and
              .head_sha == $sha and
              .status == "completed" and
              .conclusion != "success" and
              .app.slug == $app
            )] | length > 0' "$response" >/dev/null; then
            echo "Flama Preflight completed without success for $FLAMA_HEAD_SHA" >&2
            exit 1
          fi

          echo "::notice::No completed App-authored Flama Preflight for $FLAMA_HEAD_SHA yet. The merge gate and the required-check rule hold the merge until it lands."
