name: Reusable Policy Gate

on:
  workflow_call:
    inputs:
      base-sha:
        description: Exact pull-request base SHA
        required: true
        type: string
      head-sha:
        description: Exact untrusted pull-request head SHA to verify
        required: true
        type: string
      paperclip-app-slug:
        description: Owner-scoped Delivery Controller GitHub App slug
        required: true
        type: string
      platform-sha:
        description: Exact platform commit used by generated callers
        required: true
        type: string
      profile:
        description: Flama branch profile
        required: true
        type: string
      preflight-wait-seconds:
        description: >-
          How long to wait for the preflight to be published before failing.
          Default spans a full controller sweep interval, so a head pushed
          immediately after one pass still meets the next.
        required: false
        default: 2100
        type: number
      runner-labels:
        description: >-
          JSON array of runs-on labels, e.g. '["self-hosted","mainz-homelab"]'.
          Defaults to the billed GitHub-hosted runner so public and foreign
          consumers keep running unchanged.
        required: false
        default: '["ubuntu-latest"]'
        type: string

permissions:
  checks: read
  contents: read

concurrency:
  group: policy-${{ github.repository }}-${{ inputs.head-sha }}
  cancel-in-progress: true

jobs:
  policy:
    name: Flama Policy Gate
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    # Long enough to outlast the wait above rather than cutting it short, which
    # would reintroduce the same red-on-absence verdict by another route.
    timeout-minutes: 45
    steps:
      - name: Validate exact SHA input
        env:
          FLAMA_BASE_SHA: ${{ inputs.base-sha }}
          FLAMA_EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FLAMA_EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FLAMA_HEAD_SHA: ${{ inputs.head-sha }}
          FLAMA_PLATFORM_SHA: ${{ inputs.platform-sha }}
        run: |
          [[ "$FLAMA_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$FLAMA_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$FLAMA_PLATFORM_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$FLAMA_BASE_SHA" == "$FLAMA_EVENT_BASE_SHA" ]]
          [[ "$FLAMA_HEAD_SHA" == "$FLAMA_EVENT_HEAD_SHA" ]]

      - name: Check out exact platform policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: maxbec/flama-delivery-platform
          ref: ${{ inputs.platform-sha }}
          path: platform
          persist-credentials: false

      - name: Check out exact consumer source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head-sha }}
          fetch-depth: 0
          path: consumer
          persist-credentials: false

      - name: Classify deployment-only changes
        id: change
        env:
          FLAMA_BASE_SHA: ${{ inputs.base-sha }}
          FLAMA_HEAD_SHA: ${{ inputs.head-sha }}
        run: |
          mapfile -d '' files < <(git -C consumer diff --name-only --no-renames -z "$FLAMA_BASE_SHA" "$FLAMA_HEAD_SHA")
          if [[ "${#files[@]}" -eq 1 && "${files[0]}" == ".deploy/production.yaml" ]]; then
            echo 'mode=deployment' >> "$GITHUB_OUTPUT"
          else
            echo 'mode=code' >> "$GITHUB_OUTPUT"
          fi

      - name: Validate delivery contract and generated trust boundary
        env:
          FLAMA_APP_SLUG: ${{ inputs.paperclip-app-slug }}
          FLAMA_BASE_REF: ${{ github.event.pull_request.base.ref }}
          FLAMA_PLATFORM_SHA: ${{ inputs.platform-sha }}
          FLAMA_PROFILE: ${{ inputs.profile }}
        run: |
          node platform/scripts/consumer-policy-gate.mjs \
            consumer \
            "$FLAMA_BASE_REF" \
            "$FLAMA_PROFILE" \
            "$FLAMA_PLATFORM_SHA" \
            "$FLAMA_APP_SLUG" >/dev/null

      # The preflight is published by a controller that sweeps on its own
      # schedule, so it does not exist the moment a head is pushed. Sampling
      # once therefore failed the gate on absence and never looked again: the
      # check would land minutes later and the verdict stayed red until somebody
      # re-ran the job by hand. Measured on one pull request, the gate ran at
      # 14:55:15 and the preflight landed at 14:58:00.
      #
      # Waiting is the honest reading of "not published yet" — it is not the
      # same answer as "published and failed", which is decided immediately
      # below, because no amount of waiting turns a failure into a pass.
      - name: Await exact app-authored Paperclip Preflight check
        if: ${{ steps.change.outputs.mode == 'code' }}
        env:
          FLAMA_APP_SLUG: ${{ inputs.paperclip-app-slug }}
          FLAMA_HEAD_SHA: ${{ inputs.head-sha }}
          FLAMA_WAIT_SECONDS: ${{ inputs.preflight-wait-seconds }}
          GH_TOKEN: ${{ github.token }}
        run: |
          response=$(mktemp "$RUNNER_TEMP/flama-checks-XXXXXX.json")
          trap 'rm -f "$response"' EXIT
          deadline=$(( SECONDS + FLAMA_WAIT_SECONDS ))

          while :; do
            gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "/repos/$GITHUB_REPOSITORY/commits/$FLAMA_HEAD_SHA/check-runs?check_name=Paperclip%20Preflight&filter=all&per_page=100" \
              >"$response" 2>/dev/null

            if jq -e \
              --arg app "$FLAMA_APP_SLUG" \
              --arg sha "$FLAMA_HEAD_SHA" \
              '[.check_runs[] | select(
                .name == "Paperclip Preflight" and
                .head_sha == $sha and
                .status == "completed" and
                .conclusion == "success" and
                .app.slug == $app and
                (.external_id | test("^paperclip-preflight:sha256:[0-9a-f]{64}$"))
              )] | length == 1' "$response" >/dev/null; then
              exit 0
            fi

            # A completed check from the right app that did not succeed is a
            # verdict, not a gap. Fail now rather than hold a runner open for
            # an answer that has already arrived.
            if jq -e \
              --arg app "$FLAMA_APP_SLUG" \
              --arg sha "$FLAMA_HEAD_SHA" \
              '[.check_runs[] | select(
                .name == "Paperclip Preflight" and
                .head_sha == $sha and
                .status == "completed" and
                .conclusion != "success" and
                .app.slug == $app
              )] | length > 0' "$response" >/dev/null; then
              echo "Paperclip Preflight completed without success for $FLAMA_HEAD_SHA" >&2
              exit 1
            fi

            if (( SECONDS >= deadline )); then
              echo "no app-authored Paperclip Preflight for $FLAMA_HEAD_SHA within ${FLAMA_WAIT_SECONDS}s" >&2
              exit 1
            fi
            sleep 30
          done
