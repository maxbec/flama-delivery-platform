name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

# A half-written release is worse than a queued one. A failed publisher removes
# only the draft it created; a published immutable release is never mutated.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # id-token is what Infisical authenticates with; contents and
      # pull-requests remain for the fallback path GitHub grants the job itself.
      contents: write
      id-token: write
      pull-requests: write
    steps:
      # A release pull request authored by GITHUB_TOKEN emits no workflow runs:
      # GitHub suppresses them to break recursion, and additionally holds the
      # run at action_required. Foundation Gate then never reports and the pull
      # request is permanently unmergeable -- this is how every release since
      # v0.5.5 stalled, and why release-pr-checks.yaml exists to revive it. An
      # App-authored pull request is not suppressed, so mint the same Maxbec App
      # credentials the publisher below already uses.
      #
      # These steps are deliberately not best-effort. The publisher cannot cut a
      # release without Infisical either, so failing here moves an existing
      # dependency earlier and makes it loud instead of opening a pull request
      # that is born unmergeable.
      - name: Load the Maxbec delivery App credentials from Infisical
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          domain: ${{ vars.INFISICAL_DOMAIN }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ vars.INFISICAL_ENV_SLUG }}
          secret-path: ${{ vars.INFISICAL_SECRET_PATH }}
          include-imports: false
          recursive: false
          extra-headers: |
            CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
            CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Mint a repository-scoped Maxbec App token
        id: release-pr-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ env.FLAMA_GITHUB_APP_ID_MAXBEC }}
          private-key: ${{ env.FLAMA_GITHUB_APP_PRIVATE_KEY_MAXBEC }}
          owner: ${{ github.repository_owner }}
          repositories: flama-delivery-platform
          permission-contents: write
          permission-pull-requests: write

      # skip-github-release in the manifest configuration makes this PR-only.
      # The trusted publisher below owns the tag and GitHub Release.
      - name: Create or update the release pull request
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.release-pr-app.outputs.token }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  prepare-release:
    name: Prepare Platform Release
    needs: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      should-publish: ${{ steps.plan.outputs.should-publish }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      release-sha: ${{ steps.plan.outputs.release-sha }}
      artifact-file: ${{ steps.package.outputs.artifact-file }}
      sbom-file: ${{ steps.package.outputs.sbom-file }}
      checksum-file: ${{ steps.package.outputs.checksum-file }}
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Determine whether this commit carries a new version
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FLAMA_RELEASE_SHA: ${{ github.sha }}
          FLAMA_REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          version=$(node -p "require('./package.json').version")
          manifest_version=$(node -p "require('./.release-please-manifest.json')['.']")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$version" == "$manifest_version" ]]
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release-sha=$FLAMA_RELEASE_SHA" >> "$GITHUB_OUTPUT"

          if gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/releases/tags/$tag" >/dev/null 2>&1; then
            echo "should-publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag exists without a GitHub Release"
            exit 1
          fi
          [[ "$FLAMA_REF_PROTECTED" == "true" ]]
          [[ "$FLAMA_RELEASE_SHA" == "$GITHUB_SHA" ]]
          echo "should-publish=true" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.plan.outputs.should-publish == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Install locked dependencies
        if: steps.plan.outputs.should-publish == 'true'
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build and reproduce the release package
        if: steps.plan.outputs.should-publish == 'true'
        run: |
          ./scripts/delivery buildable
          node scripts/build-platform-release.mjs --output-dir release-a
          node scripts/build-platform-release.mjs --output-dir release-b
          diff -qr release-a release-b

      - name: Normalize release assets and notes
        if: steps.plan.outputs.should-publish == 'true'
        id: package
        env:
          FLAMA_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          artifact_file="flama-delivery-platform-v${FLAMA_VERSION}.tar.gz"
          sbom_file="flama-delivery-platform-v${FLAMA_VERSION}.sbom.spdx.json"
          checksum_file="$artifact_file.sha256"
          mkdir release-bundle release-metadata
          cp -- "release-a/$artifact_file" "release-bundle/$artifact_file"
          cp -- "release-a/$sbom_file" "release-bundle/$sbom_file"
          cp -- "release-a/$checksum_file" "release-bundle/$checksum_file"
          (
            cd release-bundle
            sha256sum -c "$checksum_file" --status
          )
          awk -v version="$FLAMA_VERSION" '
            BEGIN { heading = "## [" version "]" }
            index($0, heading) == 1 { capture = 1 }
            capture && /^## \[/ && index($0, heading) != 1 { exit }
            capture { print }
          ' CHANGELOG.md > release-metadata/release-notes.md
          grep -Fq "## [$FLAMA_VERSION]" release-metadata/release-notes.md
          echo "artifact-file=$artifact_file" >> "$GITHUB_OUTPUT"
          echo "sbom-file=$sbom_file" >> "$GITHUB_OUTPUT"
          echo "checksum-file=$checksum_file" >> "$GITHUB_OUTPUT"

      - name: Transfer immutable release assets
        if: steps.plan.outputs.should-publish == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: platform-release-assets-${{ github.sha }}
          path: release-bundle/
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          include-hidden-files: false

      - name: Transfer release notes
        if: steps.plan.outputs.should-publish == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: platform-release-notes-${{ github.sha }}
          path: release-metadata/release-notes.md
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          include-hidden-files: false

  publish-release:
    name: Publish Immutable Platform Release
    needs: prepare-release
    if: needs.prepare-release.outputs.should-publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: platform-release
    permissions:
      contents: read
      id-token: write
      attestations: write
      pull-requests: write
    steps:
      - name: Download normalized release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: platform-release-assets-${{ needs.prepare-release.outputs.release-sha }}
          path: release-bundle

      - name: Download release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: platform-release-notes-${{ needs.prepare-release.outputs.release-sha }}
          path: release-metadata

      - name: Reverify transferred release inputs
        env:
          FLAMA_ARTIFACT_FILE: ${{ needs.prepare-release.outputs.artifact-file }}
          FLAMA_CHECKSUM_FILE: ${{ needs.prepare-release.outputs.checksum-file }}
          FLAMA_RELEASE_SHA: ${{ needs.prepare-release.outputs.release-sha }}
          FLAMA_SBOM_FILE: ${{ needs.prepare-release.outputs.sbom-file }}
        run: |
          [[ "$FLAMA_RELEASE_SHA" == "$GITHUB_SHA" ]]
          [[ $(find release-bundle -mindepth 1 -maxdepth 1 -type f | wc -l) -eq 3 ]]
          [[ $(find release-bundle -mindepth 1 -maxdepth 1 ! -type f | wc -l) -eq 0 ]]
          for file in "$FLAMA_ARTIFACT_FILE" "$FLAMA_SBOM_FILE" "$FLAMA_CHECKSUM_FILE"; do
            [[ "$file" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,199}$ ]]
            [[ -f "release-bundle/$file" ]]
            [[ ! -L "release-bundle/$file" ]]
          done
          [[ -f release-metadata/release-notes.md ]]
          [[ ! -L release-metadata/release-notes.md ]]
          (
            cd release-bundle
            sha256sum -c "$FLAMA_CHECKSUM_FILE" --status
          )
          jq -e '.spdxVersion == "SPDX-2.3"' "release-bundle/$FLAMA_SBOM_FILE" >/dev/null

      - name: Require complete Infisical OIDC configuration
        env:
          FLAMA_INFISICAL_DOMAIN: ${{ vars.INFISICAL_DOMAIN }}
          FLAMA_INFISICAL_ENV_SLUG: ${{ vars.INFISICAL_ENV_SLUG }}
          FLAMA_INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID }}
          FLAMA_INFISICAL_PROJECT_SLUG: ${{ vars.INFISICAL_PROJECT_SLUG }}
          FLAMA_INFISICAL_SECRET_PATH: ${{ vars.INFISICAL_SECRET_PATH }}
          FLAMA_CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          FLAMA_CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          for name in DOMAIN ENV_SLUG IDENTITY_ID PROJECT_SLUG SECRET_PATH; do
            variable="FLAMA_INFISICAL_$name"
            [[ -n "${!variable}" ]] || { echo "::error::Missing repository variable INFISICAL_$name"; exit 1; }
          done
          [[ "$FLAMA_INFISICAL_DOMAIN" =~ ^https://[^/]+$ ]]
          [[ "$FLAMA_INFISICAL_SECRET_PATH" =~ ^/[A-Za-z0-9_-]+(/[A-Za-z0-9_-]+)*$ ]]
          # Infisical is published through a Cloudflare Tunnel behind Cloudflare
          # Access. The Access application "[NVGT] Infisical" protects both
          # /api/v1/auth/* and /api/v3/secrets/* with a non-identity service
          # token policy, so every request the action makes must carry the
          # service token headers or Access answers 403 before Infisical sees it.
          for name in CLIENT_ID CLIENT_SECRET; do
            variable="FLAMA_CF_ACCESS_$name"
            [[ -n "${!variable}" ]] || { echo "::error::Missing secret CF_ACCESS_$name"; exit 1; }
          done

      - name: Load the Maxbec delivery App credentials from Infisical
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          domain: ${{ vars.INFISICAL_DOMAIN }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ vars.INFISICAL_ENV_SLUG }}
          secret-path: ${{ vars.INFISICAL_SECRET_PATH }}
          include-imports: false
          recursive: false
          extra-headers: |
            CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
            CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Mint a repository-scoped Maxbec App token
        id: release-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ env.FLAMA_GITHUB_APP_ID_MAXBEC }}
          private-key: ${{ env.FLAMA_GITHUB_APP_PRIVATE_KEY_MAXBEC }}
          owner: ${{ github.repository_owner }}
          repositories: flama-delivery-platform
          permission-administration: read
          permission-contents: write

      - name: Require repository release immutability
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
        run: |
          enabled=$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/immutable-releases" --jq '.enabled')
          [[ "$enabled" == "true" ]]

      - name: Create draft release
        id: draft
        env:
          FLAMA_RELEASE_SHA: ${{ needs.prepare-release.outputs.release-sha }}
          FLAMA_TAG: ${{ needs.prepare-release.outputs.tag }}
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
        run: |
          # A draft release carries no tag, so /releases/tags/{tag} cannot see
          # it -- that endpoint resolves published releases only. Enumerate and
          # match on tag_name instead, which covers drafts and published
          # releases alike; asking by tag would silently miss a draft stranded
          # by an earlier attempt and then create a second one beside it.
          existing=$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq "[.[] | select(.tag_name == \"$FLAMA_TAG\")] | length")
          if [[ "$existing" != "0" ]]; then
            echo "::error::A release or draft already exists for $FLAMA_TAG"
            exit 1
          fi
          if gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/$FLAMA_TAG" >/dev/null 2>&1; then
            echo "::error::Tag $FLAMA_TAG already exists"
            exit 1
          fi
          # Create through the API rather than `gh release create`, so the id
          # comes back from the same call. Recovering it afterwards by tag is
          # impossible for a draft, and without the id the failure-path cleanup
          # below cannot run either.
          release_id=$(gh api --method POST -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/releases" \
            -f tag_name="$FLAMA_TAG" \
            -f target_commitish="$FLAMA_RELEASE_SHA" \
            -f name="$FLAMA_TAG" \
            -f body="$(cat release-metadata/release-notes.md)" \
            -F draft=true \
            -F prerelease=false \
            --jq '.id')
          [[ "$release_id" =~ ^[0-9]+$ ]]
          echo "release-id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Attach all assets to the draft
        env:
          FLAMA_ARTIFACT_FILE: ${{ needs.prepare-release.outputs.artifact-file }}
          FLAMA_CHECKSUM_FILE: ${{ needs.prepare-release.outputs.checksum-file }}
          FLAMA_RELEASE_ID: ${{ steps.draft.outputs.release-id }}
          FLAMA_SBOM_FILE: ${{ needs.prepare-release.outputs.sbom-file }}
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
        run: |
          # Upload by release id for the same reason the draft is created by id:
          # the tag does not exist until the release is published.
          for file in "$FLAMA_ARTIFACT_FILE" "$FLAMA_CHECKSUM_FILE" "$FLAMA_SBOM_FILE"; do
            gh api --method POST \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              -H 'Content-Type: application/octet-stream' \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${FLAMA_RELEASE_ID}/assets?name=${file}" \
              --input "release-bundle/$file" >/dev/null
          done

      - name: Attest platform release assets
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release-bundle/*

      - name: Publish immutable release
        env:
          FLAMA_ARTIFACT_FILE: ${{ needs.prepare-release.outputs.artifact-file }}
          FLAMA_CHECKSUM_FILE: ${{ needs.prepare-release.outputs.checksum-file }}
          FLAMA_RELEASE_ID: ${{ steps.draft.outputs.release-id }}
          FLAMA_SBOM_FILE: ${{ needs.prepare-release.outputs.sbom-file }}
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
        run: |
          release_json=$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/releases/$FLAMA_RELEASE_ID")
          [[ $(jq -r '.draft' <<< "$release_json") == "true" ]]
          [[ $(jq -r '.assets | length' <<< "$release_json") -eq 3 ]]
          for file in "$FLAMA_ARTIFACT_FILE" "$FLAMA_CHECKSUM_FILE" "$FLAMA_SBOM_FILE"; do
            local_digest="sha256:$(sha256sum "release-bundle/$file" | cut -d' ' -f1)"
            remote_digest=$(jq -r --arg file "$file" '.assets[] | select(.name == $file) | .digest' <<< "$release_json")
            [[ "$remote_digest" == "$local_digest" ]]
          done
          # `gh api` splits a field on its first `=`, so the httpie-style
          # `-F draft:='false'` sends a field named `draft:`, leaves the release
          # a draft, and still returns 200 -- a green step that published
          # nothing. Assert the flag actually cleared rather than trusting it.
          published_draft=$(gh api --method PATCH -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/releases/$FLAMA_RELEASE_ID" \
            -F draft=false \
            --jq '.draft')
          [[ "$published_draft" == "false" ]]

      - name: Verify immutable release and attestations
        env:
          FLAMA_ARTIFACT_FILE: ${{ needs.prepare-release.outputs.artifact-file }}
          FLAMA_CHECKSUM_FILE: ${{ needs.prepare-release.outputs.checksum-file }}
          FLAMA_RELEASE_SHA: ${{ needs.prepare-release.outputs.release-sha }}
          FLAMA_SBOM_FILE: ${{ needs.prepare-release.outputs.sbom-file }}
          FLAMA_TAG: ${{ needs.prepare-release.outputs.tag }}
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
        run: |
          immutable=false
          for _attempt in {1..12}; do
            immutable=$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/releases/tags/$FLAMA_TAG" --jq '.immutable')
            [[ "$immutable" == "true" ]] && break
            sleep 5
          done
          [[ "$immutable" == "true" ]]
          tag_sha=$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/commits/$FLAMA_TAG" --jq '.sha')
          [[ "$tag_sha" == "$FLAMA_RELEASE_SHA" ]]
          gh release verify "$FLAMA_TAG" --repo "$GITHUB_REPOSITORY" --format json >/dev/null
          for file in "$FLAMA_ARTIFACT_FILE" "$FLAMA_CHECKSUM_FILE" "$FLAMA_SBOM_FILE"; do
            gh release verify-asset "$FLAMA_TAG" "release-bundle/$file" \
              --repo "$GITHUB_REPOSITORY" --format json >/dev/null
          done

      - name: Remove an incomplete draft created by this run
        if: failure() && steps.draft.outputs.release-id != ''
        env:
          FLAMA_RELEASE_ID: ${{ steps.draft.outputs.release-id }}
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
        run: |
          is_draft=$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/releases/$FLAMA_RELEASE_ID" --jq '.draft')
          if [[ "$is_draft" == "true" ]]; then
            gh api --method DELETE -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/releases/$FLAMA_RELEASE_ID"
          fi

      # skip-github-release makes release-please PR-only: it never tags and
      # never flips the merged PR's label to `autorelease: tagged`, so every
      # subsequent push reads the merged PR as still-open and cuts nothing
      # ("Release skipped from strategy config"). This job is the only place
      # that actually creates the tag, so it is the only place that can know
      # the label is now safe to flip. github.token (not the Maxbec App token)
      # is used deliberately: this is an API call this job makes about itself,
      # not a push that needs to start another workflow run.
      - name: Relabel the release PR the tag was just cut from
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          FLAMA_RELEASE_SHA: ${{ needs.prepare-release.outputs.release-sha }}
        run: |
          set -euo pipefail
          pr_number=$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/commits/${FLAMA_RELEASE_SHA}/pulls" \
            --jq '[.[] | select(.head.ref | startswith("release-please--")) | select(.merged_at != null)][0].number // empty')
          if [[ -z "$pr_number" ]]; then
            echo "::notice::Release commit is not a release-please merge — nothing to relabel."
            exit 0
          fi
          labels=$(gh pr view "$pr_number" --repo "${GITHUB_REPOSITORY}" --json labels --jq '[.labels[].name][]')
          if grep -Fqx 'autorelease: pending' <<< "$labels"; then
            gh pr edit "$pr_number" --repo "${GITHUB_REPOSITORY}" \
              --remove-label 'autorelease: pending' --add-label 'autorelease: tagged'
            echo "::notice::Relabeled release PR #$pr_number: autorelease: pending -> tagged"
          else
            echo "::notice::Release PR #$pr_number already correctly labeled."
          fi
