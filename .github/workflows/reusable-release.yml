name: Reusable Release Evidence

on:
  workflow_call:
    inputs:
      head-sha:
        description: Exact protected commit that produced the artifact
        required: true
        type: string
      artifact-name:
        description: Stable artifact evidence name
        required: true
        type: string
      artifact-path:
        description: Repository-relative immutable artifact path
        required: true
        type: string
      sbom-path:
        description: Repository-relative SPDX or CycloneDX SBOM path
        required: true
        type: string
      checksum-path:
        description: Repository-relative SHA-256 checksum path
        required: true
        type: string
    outputs:
      artifact-digest:
        description: SHA-256 digest of the attested artifact
        value: ${{ jobs.attest.outputs.artifact-digest }}
      sbom-digest:
        description: SHA-256 digest of the attested SBOM
        value: ${{ jobs.attest.outputs.sbom-digest }}
      checksum-digest:
        description: SHA-256 digest of the attested checksum
        value: ${{ jobs.attest.outputs.checksum-digest }}

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}-${{ inputs.head-sha }}
  cancel-in-progress: false

jobs:
  trust:
    name: Release Trust Gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require an exact protected non-PR commit
        env:
          FLAMA_EVENT_NAME: ${{ github.event_name }}
          FLAMA_HEAD_SHA: ${{ inputs.head-sha }}
          FLAMA_REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          [[ "$FLAMA_EVENT_NAME" != "pull_request" ]]
          [[ "$FLAMA_REF_PROTECTED" == "true" ]]
          [[ "$FLAMA_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$FLAMA_HEAD_SHA" == "${GITHUB_SHA}" ]]

  package:
    name: Build Release Package
    needs: trust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      artifact-digest: ${{ steps.evidence.outputs.artifact-digest }}
      artifact-file: ${{ steps.evidence.outputs.artifact-file }}
      sbom-digest: ${{ steps.evidence.outputs.sbom-digest }}
      sbom-file: ${{ steps.evidence.outputs.sbom-file }}
      checksum-digest: ${{ steps.evidence.outputs.checksum-digest }}
      checksum-file: ${{ steps.evidence.outputs.checksum-file }}
    steps:
      - name: Check out exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head-sha }}
          persist-credentials: false

      - name: Build release package without repeating tests
        run: ./scripts/delivery buildable

      - name: Validate and normalize release evidence
        id: evidence
        env:
          FLAMA_ARTIFACT_NAME: ${{ inputs.artifact-name }}
          FLAMA_ARTIFACT_PATH: ${{ inputs.artifact-path }}
          FLAMA_SBOM_PATH: ${{ inputs.sbom-path }}
          FLAMA_CHECKSUM_PATH: ${{ inputs.checksum-path }}
        run: |
          [[ "$FLAMA_ARTIFACT_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,199}$ ]]
          workspace=$(realpath -e -- "$GITHUB_WORKSPACE")
          for path in "$FLAMA_ARTIFACT_PATH" "$FLAMA_SBOM_PATH" "$FLAMA_CHECKSUM_PATH"; do
            [[ "$path" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,499}$ ]]
            [[ "$path" != /* ]]
            [[ "$path" != *..* ]]
            [[ "$path" != *//* ]]
            [[ -f "$path" ]]
            [[ ! -L "$path" ]]
            lexical=$(realpath -m -- "$path")
            physical=$(realpath -e -- "$path")
            [[ "$physical" == "$workspace/"* ]]
            [[ "$physical" == "$lexical" ]]
          done
          [[ "$FLAMA_CHECKSUM_PATH" == "$FLAMA_ARTIFACT_PATH.sha256" ]]
          artifact_file=$(basename "$FLAMA_ARTIFACT_PATH")
          sbom_file=$(basename "$FLAMA_SBOM_PATH")
          checksum_file=$(basename "$FLAMA_CHECKSUM_PATH")
          FLAMA_CHECKSUM_FILE=$checksum_file
          [[ "$artifact_file" != "$sbom_file" ]]
          [[ "$artifact_file" != "$checksum_file" ]]
          [[ "$sbom_file" != "$checksum_file" ]]
          (
            cd "$(dirname "$FLAMA_ARTIFACT_PATH")"
            sha256sum -c "$(basename "$FLAMA_CHECKSUM_PATH")" --status
          )
          mkdir release-bundle
          cp -- "$FLAMA_ARTIFACT_PATH" "release-bundle/$artifact_file"
          cp -- "$FLAMA_SBOM_PATH" "release-bundle/$sbom_file"
          cp -- "$FLAMA_CHECKSUM_PATH" "release-bundle/$checksum_file"
          (
            cd release-bundle
            sha256sum -c "$FLAMA_CHECKSUM_FILE" --status
          )
          artifact_digest="sha256:$(sha256sum "release-bundle/$artifact_file" | cut -d' ' -f1)"
          sbom_digest="sha256:$(sha256sum "release-bundle/$sbom_file" | cut -d' ' -f1)"
          checksum_digest="sha256:$(sha256sum "release-bundle/$checksum_file" | cut -d' ' -f1)"
          echo "artifact-digest=$artifact_digest" >> "$GITHUB_OUTPUT"
          echo "artifact-file=$artifact_file" >> "$GITHUB_OUTPUT"
          echo "sbom-digest=$sbom_digest" >> "$GITHUB_OUTPUT"
          echo "sbom-file=$sbom_file" >> "$GITHUB_OUTPUT"
          echo "checksum-digest=$checksum_digest" >> "$GITHUB_OUTPUT"
          echo "checksum-file=$checksum_file" >> "$GITHUB_OUTPUT"

      - name: Transfer normalized release evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ inputs.artifact-name }}
          path: release-bundle/
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          include-hidden-files: false

  attest:
    name: Attest Release Evidence
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      artifact-digest: ${{ needs.package.outputs.artifact-digest }}
      sbom-digest: ${{ needs.package.outputs.sbom-digest }}
      checksum-digest: ${{ needs.package.outputs.checksum-digest }}
    steps:
      - name: Download normalized release evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: release-bundle

      - name: Reverify transferred release evidence
        env:
          FLAMA_ARTIFACT_DIGEST: ${{ needs.package.outputs.artifact-digest }}
          FLAMA_ARTIFACT_FILE: ${{ needs.package.outputs.artifact-file }}
          FLAMA_SBOM_DIGEST: ${{ needs.package.outputs.sbom-digest }}
          FLAMA_SBOM_FILE: ${{ needs.package.outputs.sbom-file }}
          FLAMA_CHECKSUM_DIGEST: ${{ needs.package.outputs.checksum-digest }}
          FLAMA_CHECKSUM_FILE: ${{ needs.package.outputs.checksum-file }}
        run: |
          [[ $(find release-bundle -mindepth 1 -maxdepth 1 | wc -l) -eq 3 ]]
          for role in ARTIFACT SBOM CHECKSUM; do
            file_variable="FLAMA_${role}_FILE"
            digest_variable="FLAMA_${role}_DIGEST"
            file=${!file_variable}
            expected=${!digest_variable}
            [[ "$file" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,199}$ ]]
            [[ "$expected" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ -f "release-bundle/$file" ]]
            [[ ! -L "release-bundle/$file" ]]
            actual="sha256:$(sha256sum "release-bundle/$file" | cut -d' ' -f1)"
            [[ "$actual" == "$expected" ]]
          done
          (
            cd release-bundle
            sha256sum -c "$FLAMA_CHECKSUM_FILE" --status
          )

      - name: Attest artifact provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release-bundle/${{ needs.package.outputs.artifact-file }}

      - name: Attest SBOM provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release-bundle/${{ needs.package.outputs.sbom-file }}

      - name: Attest checksum provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release-bundle/${{ needs.package.outputs.checksum-file }}
