---
name: 🔎 Release PR checks

# Release PRs on `main` are opened by release-please with GITHUB_TOKEN. GitHub
# suppresses `pull_request` workflow runs for GITHUB_TOKEN-authored PRs
# (anti-recursion), so the required check — Foundation Gate — never reports and
# the PR is permanently unmergeable. v0.5.6 had to be revived by hand.
#
# A close/reopen performed with the App token emits real `pull_request` events,
# so those checks run and report legitimately. Nothing is skipped, weakened or
# bypassed: GitHub still enforces every required check at merge time.
#
# This workflow ONLY revives the checks. It never merges and never arms
# auto-merge — merging the release PR is a human decision, like every other
# merge into `main`. (It replaces the auto-merge half of the former
# release-automerge.yaml in maxbec/pipeline.)
#
# The App credentials come from Infisical, the same way publish-release in
# release.yml loads them — this repo has no repository-level WORKFLOW_APP_ID
# secret (maxbec is a user account, not an org, and repo secrets here are
# empty by design; only the platform-release environment carries the CF
# Access service-token secrets this action needs). The job is gated on the
# repository variable that config actually requires, so it is inert rather
# than red on a fork or a repo that hasn't wired Infisical up yet.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: release-pr-checks-${{ github.repository }}
  cancel-in-progress: false

jobs:
  revive:
    name: Re-fire suppressed checks on the release PR
    if: ${{ vars.INFISICAL_IDENTITY_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: platform-release
    steps:
      - name: Require complete Infisical OIDC configuration
        env:
          FLAMA_INFISICAL_DOMAIN: ${{ vars.INFISICAL_DOMAIN }}
          FLAMA_INFISICAL_ENV_SLUG: ${{ vars.INFISICAL_ENV_SLUG }}
          FLAMA_INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID }}
          FLAMA_INFISICAL_PROJECT_SLUG: ${{ vars.INFISICAL_PROJECT_SLUG }}
          FLAMA_INFISICAL_SECRET_PATH: ${{ vars.INFISICAL_SECRET_PATH }}
          FLAMA_CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          FLAMA_CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          for name in DOMAIN ENV_SLUG IDENTITY_ID PROJECT_SLUG SECRET_PATH; do
            variable="FLAMA_INFISICAL_$name"
            [[ -n "${!variable}" ]] || { echo "::error::Missing repository variable INFISICAL_$name"; exit 1; }
          done
          [[ "$FLAMA_INFISICAL_DOMAIN" =~ ^https://[^/]+$ ]]
          [[ "$FLAMA_INFISICAL_SECRET_PATH" =~ ^/[A-Za-z0-9_-]+(/[A-Za-z0-9_-]+)*$ ]]
          for name in CLIENT_ID CLIENT_SECRET; do
            variable="FLAMA_CF_ACCESS_$name"
            [[ -n "${!variable}" ]] || { echo "::error::Missing secret CF_ACCESS_$name"; exit 1; }
          done

      - name: Load the Maxbec delivery App credentials from Infisical
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          domain: ${{ vars.INFISICAL_DOMAIN }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ vars.INFISICAL_ENV_SLUG }}
          secret-path: ${{ vars.INFISICAL_SECRET_PATH }}
          include-imports: false
          recursive: false
          extra-headers: |
            CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
            CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: 🔑 Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ env.FLAMA_GITHUB_APP_ID_MAXBEC }}
          private-key: ${{ env.FLAMA_GITHUB_APP_PRIVATE_KEY_MAXBEC }}

      - name: 🔎 Re-fire checks on the stable release PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # release.yaml runs on the same push and needs a moment to open or
          # update the release PR — poll briefly before concluding no-op.
          PR_NUMBER=""
          for _ in 1 2 3 4 5 6; do
            PR_NUMBER=$(gh pr list --repo "$REPO" --base main --state open \
              --json number,headRefName \
              --jq '[.[] | select(.headRefName | startswith("release-please"))][0].number // empty')
            [[ -n "$PR_NUMBER" ]] && break
            sleep 20
          done
          if [[ -z "$PR_NUMBER" ]]; then
            echo "::notice::No open release PR on main — nothing to do."
            exit 0
          fi

          HEAD_SHA=$(gh pr view "$PR_NUMBER" --repo "$REPO" \
            --json headRefOid --jq .headRefOid)

          CHECKS=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs" --jq '.total_count')
          if [[ "$CHECKS" -gt 0 ]]; then
            echo "✅ Release PR #$PR_NUMBER already has $CHECKS check run(s) — nothing to do."
            exit 0
          fi

          echo "No check runs on $HEAD_SHA — re-firing via App close/reopen of PR #$PR_NUMBER."
          gh pr close "$PR_NUMBER" --repo "$REPO"
          sleep 5
          gh pr reopen "$PR_NUMBER" --repo "$REPO"
          echo "✅ Checks re-fired on release PR #$PR_NUMBER. Merging it stays a human decision."
